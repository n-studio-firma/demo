<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOIRICA</title>
  <link rel="canonical" href="https://noirica.com/">
  <link rel="alternate" hreflang="ja" href="https://noirica.com/ja/">
  <link rel="alternate" hreflang="en" href="https://noirica.com/en/">
  <link rel="alternate" hreflang="x-default" href="https://noirica.com/">
  <script>
    (function () {
      var base = location.href.replace(/[^/]*$/, '');
      var lang = (navigator.language || navigator.userLanguage || 'ja').toLowerCase();
      if (lang.startsWith('ja')) {
        location.replace(base + 'ja/');
      } else {
        location.replace(base + 'en/');
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=ja/">
  </noscript>
  <style>
    body {
      margin: 0;
      background: #0B0B0B;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Cinzel', serif;
    }
    .redirect-links {
      text-align: center;
      color: #C4A265;
    }
    .redirect-links a {
      color: #C4A265;
      text-decoration: none;
      margin: 0 12px;
      font-size: 13px;
      letter-spacing: 3px;
    }
    .redirect-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-links">
    <a href="ja/">日本語</a>
    <a href="en/">English</a>
  </div>
</body>
</html>
